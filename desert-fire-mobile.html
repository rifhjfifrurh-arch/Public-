<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
#rotate-msg {
  display:none;
  position:fixed; inset:0; z-index:999;
  background:#000;
  flex-direction:column;
  align-items:center; justify-content:center;
  color:#ff6600; font-size:24px; font-family:monospace;
  text-align:center; gap:20px;
}
@media (orientation: portrait) {
  #rotate-msg { display:flex !important; }
  #game-root { display:none !important; }
}
</style>
<title>🔥 Desert Fire</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:#000; overflow:hidden; touch-action:none; user-select:none; }
canvas { display:block; position:fixed; top:0; left:0; }

#menu {
  position:fixed; inset:0;
  background:radial-gradient(ellipse,#1a0800,#000);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center; z-index:20;
}
#menu h1 {
  font-size:clamp(38px,12vw,72px); font-weight:900;
  color:#ff6600; font-family:monospace;
  text-shadow:0 0 40px #ff4400,0 0 80px #ff2200;
  margin-bottom:8px; text-align:center;
}
#menu .sub { color:#ff9944; font-size:clamp(13px,3.5vw,16px); text-align:center; line-height:2.2; direction:rtl; padding:0 24px; margin-bottom:6px; }
#menu .best { color:#888; font-size:13px; margin-bottom:20px; }
.btn {
  background:linear-gradient(135deg,#ff6600,#cc2200);
  border:none; color:#fff;
  font-size:clamp(18px,5vw,24px); font-weight:bold;
  padding:16px 60px; border-radius:50px;
  cursor:pointer; box-shadow:0 0 30px #ff440099;
  margin:6px; font-family:monospace;
}
.btn2 { background:rgba(255,100,0,0.18); border:1px solid rgba(255,100,0,0.4); }

/* HUD */
#hud {
  position:fixed; top:0; left:0; right:0;
  display:none; padding:10px 14px;
  justify-content:space-between; z-index:10;
  pointer-events:none;
}
.hbox {
  background:rgba(0,0,0,0.72);
  border:1px solid rgba(255,100,0,0.4);
  border-radius:10px; padding:6px 12px;
  color:#fff; font-size:11px;
}
.hval { font-size:18px; font-weight:bold; color:#ff6600; display:block; font-family:monospace; }
.hpbar { width:110px; height:7px; background:#333; border-radius:4px; margin-top:4px; }
.hpfill { height:7px; border-radius:4px; background:linear-gradient(90deg,#ff2200,#ff8800,#44ff44); transition:width .2s; }

/* Mobile joystick */
#joy-wrap {
  position:fixed; bottom:24px; left:24px;
  width:120px; height:120px; z-index:15;
  display:none; pointer-events:all;
}
#joy-base {
  width:120px; height:120px;
  background:rgba(255,255,255,0.08);
  border:2px solid rgba(255,255,255,0.22);
  border-radius:50%; position:absolute;
}
#joy-knob {
  width:52px; height:52px;
  background:rgba(255,150,50,0.65);
  border:2px solid rgba(255,200,100,0.85);
  border-radius:50%; position:absolute;
  top:34px; left:34px;
}

#fire-btn {
  position:fixed; bottom:34px; right:28px;
  width:90px; height:90px;
  background:rgba(255,40,40,0.72);
  border:3px solid rgba(255,100,100,0.9);
  border-radius:50%; z-index:15;
  display:none; align-items:center; justify-content:center;
  font-size:34px; pointer-events:all;
}
#reload-btn {
  position:fixed; bottom:138px; right:34px;
  width:58px; height:58px;
  background:rgba(255,200,50,0.65);
  border:2px solid rgba(255,220,100,0.85);
  border-radius:50%; z-index:15;
  display:none; align-items:center; justify-content:center;
  font-size:22px; pointer-events:all;
}

/* Messages */
#wave-msg {
  position:fixed; top:40%; left:50%; transform:translate(-50%,-50%);
  color:#ffcc00; font-size:clamp(22px,7vw,38px); font-weight:900;
  text-shadow:0 0 25px #ffaa00; display:none; pointer-events:none;
  white-space:nowrap; font-family:monospace; z-index:10;
}
#zone-warn {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  color:#ff0000; font-size:clamp(14px,4vw,20px); font-weight:bold;
  text-shadow:0 0 12px #ff0000; display:none; pointer-events:none;
  animation:blink .5s infinite alternate; direction:rtl; z-index:10; text-align:center;
}
@keyframes blink { from{opacity:.4} to{opacity:1} }
#rl-msg {
  position:fixed; bottom:155px; left:50%; transform:translateX(-50%);
  color:#ffcc00; font-size:15px; font-weight:bold;
  display:none; pointer-events:none; z-index:10; direction:rtl;
}

/* Kill feed */
#kfeed {
  position:fixed; top:70px; right:10px;
  display:flex; flex-direction:column; gap:4px;
  pointer-events:none; z-index:10;
}
.kmsg {
  background:rgba(0,0,0,0.72); border-left:3px solid #ff4444;
  padding:4px 8px; color:#ff9999; font-size:12px;
  border-radius:0 6px 6px 0; animation:kfade 3s forwards;
}
@keyframes kfade { 0%{opacity:0;transform:translateX(15px)} 15%{opacity:1;transform:none} 70%{opacity:1} 100%{opacity:0} }

/* Game Over */
#gameover {
  position:fixed; inset:0; background:rgba(0,0,0,0.88);
  display:none; flex-direction:column;
  align-items:center; justify-content:center; z-index:20;
}
#gameover h2 { font-size:clamp(42px,12vw,65px); font-weight:900; color:#ff2200; text-shadow:0 0 30px #ff0000; margin-bottom:12px; font-family:monospace; }
.gostats { display:flex; gap:14px; margin-bottom:24px; }
.gobox { background:rgba(255,100,0,0.1); border:1px solid rgba(255,100,0,0.3); border-radius:12px; padding:12px 18px; text-align:center; }
.gobox .v { font-size:clamp(24px,8vw,36px); font-weight:900; font-family:monospace; }
.gobox .l { color:rgba(255,150,50,0.7); font-size:12px; }
</style>
</head>
<body>

<!-- Rotate message -->
<div id="rotate-msg">
  <div style="font-size:60px">📱➡️</div>
  <div>حوّل الموبايل أفقي عشان تلعب!</div>
  <div style="font-size:14px;color:#ff9900">Rotate your phone to landscape</div>
</div>

<div id="game-root">
<canvas id="c"></canvas>

<!-- MENU -->
<div id="menu">
  <h1>🔥 DESERT FIRE</h1>
  <div class="sub">جويستيك يسار = تحرك<br>اضغط يمين = إطلاق نار تلقائي نحو أقرب عدو</div>
  <div class="best">أعلى نتيجة: <b id="best" style="color:#ff9900">0</b> | أعلى قتل: <b id="bestkills" style="color:#ff4444">0</b></div>
  <button class="btn" onclick="startGame()">🎮 العب دلوقتي!</button>
</div>

<!-- HUD -->
<div id="hud">
  <div style="display:flex;flex-direction:column;gap:6px">
    <div class="hbox">
      <span style="color:#ff9900;font-size:10px">❤️ الحياة</span>
      <div class="hpbar"><div class="hpfill" id="hpbar" style="width:100%"></div></div>
      <span style="color:#aaa;font-size:11px" id="hpnum">100/100</span>
    </div>
    <div class="hbox">🏆 <span class="hval" id="score">0</span></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
    <div class="hbox">🔫 <span class="hval" id="ammo">30/90</span></div>
    <div class="hbox">💀 <span class="hval" id="kills">0</span></div>
    <div class="hbox">🌊 <span class="hval" id="wavenum">1</span></div>
  </div>
</div>

<!-- Mobile Controls -->
<div id="joy-wrap">
  <div id="joy-base"></div>
  <div id="joy-knob"></div>
</div>
<div id="fire-btn">🔴</div>
<div id="reload-btn">🔄</div>

<!-- Messages -->
<div id="wave-msg"></div>
<div id="zone-warn">⚠️ اخرج من المنطقة!</div>
<div id="rl-msg">🔄 جاري التحميل...</div>
<div id="kfeed"></div>

<!-- GAME OVER -->
<div id="gameover">
  <h2>💀 مت!</h2>
  <div class="gostats">
    <div class="gobox"><div class="v" id="go-score" style="color:#ff6600">0</div><div class="l">النقاط</div></div>
    <div class="gobox"><div class="v" id="go-kills" style="color:#ff4444">0</div><div class="l">القتلى</div></div>
    <div class="gobox"><div class="v" id="go-wave" style="color:#88ddff">1</div><div class="l">الموجة</div></div>
  </div>
  <button class="btn" onclick="startGame()">🔄 العب تاني</button>
  <button class="btn btn2" onclick="showMenu()">🏠 القائمة</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

// ---- STATE ----
const WORLD = 2200;
let G = null, raf = null;
let bestScore = 0, bestKills = 0;

// ---- JOYSTICK ----
const joy = { active:false, id:-1, sx:0, sy:0, dx:0, dy:0 };
let mobileFiring = false;
let autoAim = true; // on mobile, auto-aim at nearest enemy

const jWrap = document.getElementById('joy-wrap');
const jKnob = document.getElementById('joy-knob');
const fireBtn = document.getElementById('fire-btn');
const reloadBtn = document.getElementById('reload-btn');

jWrap.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  joy.active=true; joy.id=t.identifier;
  joy.sx=t.clientX; joy.sy=t.clientY; joy.dx=0; joy.dy=0;
}, {passive:false});
jWrap.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier !== joy.id) continue;
    const dx=t.clientX-joy.sx, dy=t.clientY-joy.sy;
    const len=Math.hypot(dx,dy), max=48;
    joy.dx = dx/Math.max(len,1)*Math.min(len,max)/max;
    joy.dy = dy/Math.max(len,1)*Math.min(len,max)/max;
    jKnob.style.transform = `translate(${joy.dx*max}px,${joy.dy*max}px)`;
  }
}, {passive:false});
jWrap.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier===joy.id) { joy.active=false; joy.dx=0; joy.dy=0; jKnob.style.transform=''; }
  }
}, {passive:false});

fireBtn.addEventListener('touchstart', e => { e.preventDefault(); mobileFiring=true; }, {passive:false});
fireBtn.addEventListener('touchend', e => { e.preventDefault(); mobileFiring=false; }, {passive:false});
reloadBtn.addEventListener('touchstart', e => { e.preventDefault(); if(G) G.reload(); }, {passive:false});

// Desktop
const keys = {};
document.addEventListener('keydown', e => { keys[e.code]=true; if(e.code==='KeyR'&&G) G.reload(); if(e.code==='Escape'&&G) showMenu(); });
document.addEventListener('keyup', e => { keys[e.code]=false; });
let mx=0, my=0, mfire=false;
canvas.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; });
canvas.addEventListener('mousedown', e => { if(e.button===0) mfire=true; });
canvas.addEventListener('mouseup', e => { if(e.button===0) mfire=false; });

// ---- HELPERS ----
function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function dst(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)||window.innerWidth<768;

function addKill(msg) {
  const f=document.getElementById('kfeed');
  const d=document.createElement('div'); d.className='kmsg'; d.textContent=msg;
  f.appendChild(d); setTimeout(()=>d.remove(),3000);
}
function showWaveMsg(txt) {
  const a=document.getElementById('wave-msg');
  a.textContent=txt; a.style.display='block'; a.style.opacity='1';
  setTimeout(()=>{ a.style.transition='opacity 1s'; a.style.opacity='0'; setTimeout(()=>{a.style.display='none';a.style.transition='';},1000); },1800);
}

// ---- GAME ----
class Game {
  constructor() {
    this.p = { x:WORLD/2, y:WORLD/2, angle:0, hp:100, maxHp:100, ammo:30, maxAmmo:30, reserve:90, speed:3.5, size:16, shootCD:0, reloading:false, reloadT:0, invincible:0, muzzle:0, score:0, kills:0 };
    this.bullets = [];
    this.eBullets = [];
    this.enemies = [];
    this.particles = [];
    this.pickups = this.mkPickups();
    this.trees = this.mkTrees();
    this.rocks = this.mkRocks();
    this.wave = 0;
    this.waveCD = 60;
    this.alive = true;
    this.zone = { x:WORLD/2, y:WORLD/2, r:WORLD*0.46 };
    this.zoneT = { x:WORLD/2, y:WORLD/2, r:320 };
    this.zoneShrink = false;
    this.zoneTimer = 700;
    this.nextWave();
  }

  mkTrees() { return Array.from({length:80},()=>({x:rnd(50,WORLD-50),y:rnd(50,WORLD-50),r:rnd(12,24),c:`hsl(${rnd(100,140)},45%,${rnd(18,30)}%)`})); }
  mkRocks() { return Array.from({length:40},()=>({x:rnd(50,WORLD-50),y:rnd(50,WORLD-50),w:rnd(22,52),h:rnd(16,30)})); }
  mkPickups() { return Array.from({length:14},()=>({x:rnd(150,WORLD-150),y:rnd(150,WORLD-150),type:Math.random()<0.5?'hp':'ammo',taken:false})); }

  reload() {
    const p=this.p;
    if(p.reloading||p.ammo===p.maxAmmo||p.reserve<=0) return;
    p.reloading=true; p.reloadT=100;
  }

  nextWave() {
    this.wave++;
    const n = 3+this.wave*2;
    for (let i=0;i<n;i++) {
      let ex,ey;
      do { ex=rnd(80,WORLD-80); ey=rnd(80,WORLD-80); } while(dst({x:ex,y:ey},this.p)<320);
      const roll=Math.random();
      let type='normal';
      if(this.wave>=3&&roll<0.2) type='tank';
      else if(this.wave>=2&&roll<0.4) type='fast';
      const hp=type==='tank'?200:type==='fast'?40:80;
      this.enemies.push({x:ex,y:ey,hp,maxHp:hp,type,size:type==='tank'?22:type==='fast'?12:15,speed:type==='tank'?0.7:type==='fast'?3.0:1.5,angle:0,shootCD:rnd(40,80),flash:0,dead:false});
    }
    showWaveMsg(`🌊 موجة ${this.wave}! (${n} عدو)`);
  }

  spawnP(x,y,color,n=8) {
    for(let i=0;i<n;i++) this.particles.push({x,y,vx:rnd(-4,4),vy:rnd(-4,4),life:1,decay:rnd(0.04,0.08),size:rnd(2,5),color});
  }

  update() {
    if(!this.alive) return;
    const p=this.p;
    const W=canvas.width, H=canvas.height;
    if(p.invincible>0) p.invincible--;
    if(p.muzzle>0) p.muzzle--;
    if(p.shootCD>0) p.shootCD--;

    // ---- MOVE ----
    if(isMobile) {
      if(joy.active&&(Math.abs(joy.dx)>0.05||Math.abs(joy.dy)>0.05)) {
        p.x += joy.dx*p.speed; p.y += joy.dy*p.speed;
      }
      // Auto-aim: find nearest enemy
      if(this.enemies.length>0) {
        let nearest=null, minD=9999;
        this.enemies.forEach(e=>{ const d=dst(p,e); if(d<minD){minD=d;nearest=e;} });
        if(nearest) p.angle = Math.atan2(nearest.y-p.y, nearest.x-p.x);
      }
      // Shoot
      if(mobileFiring&&p.shootCD<=0&&!p.reloading) {
        if(p.ammo>0) {
          p.ammo--; p.shootCD=10; p.muzzle=6;
          const sp=rnd(-0.08,0.08);
          const bx=p.x+Math.cos(p.angle)*(p.size+12), by=p.y+Math.sin(p.angle)*(p.size+12);
          this.bullets.push({x:bx,y:by,angle:p.angle+sp,speed:13,dead:false,trail:[]});
        } else this.reload();
      }
    } else {
      // Desktop
      let dx=0,dy=0;
      if(keys['KeyW']||keys['ArrowUp']) dy=-1;
      if(keys['KeyS']||keys['ArrowDown']) dy=1;
      if(keys['KeyA']||keys['ArrowLeft']) dx=-1;
      if(keys['KeyD']||keys['ArrowRight']) dx=1;
      if(dx&&dy){dx*=0.707;dy*=0.707;}
      p.x+=dx*p.speed; p.y+=dy*p.speed;
      const camX=p.x-W/2, camY=p.y-H/2;
      p.angle = Math.atan2(my-(p.y-camY), mx-(p.x-camX));
      if(mfire&&p.shootCD<=0&&!p.reloading) {
        if(p.ammo>0) {
          p.ammo--; p.shootCD=8; p.muzzle=6;
          const bx=p.x+Math.cos(p.angle)*(p.size+12), by=p.y+Math.sin(p.angle)*(p.size+12);
          this.bullets.push({x:bx,y:by,angle:p.angle+rnd(-0.05,0.05),speed:13,dead:false,trail:[]});
        } else this.reload();
      }
    }

    p.x=clamp(p.x,p.size,WORLD-p.size); p.y=clamp(p.y,p.size,WORLD-p.size);

    // ---- RELOAD ----
    if(p.reloading) {
      p.reloadT--;
      if(p.reloadT<=0) {
        const need=p.maxAmmo-p.ammo, take=Math.min(need,p.reserve);
        p.ammo+=take; p.reserve-=take; p.reloading=false;
      }
    }

    // ---- ZONE ----
    this.zoneTimer--;
    if(this.zoneTimer<=0&&!this.zoneShrink){this.zoneShrink=true;this.zoneTimer=450;}
    if(this.zoneShrink){
      this.zone.r-=0.2;
      if(this.zone.r<=this.zoneT.r){
        this.zoneShrink=false; this.zoneTimer=400;
        this.zoneT={x:this.zone.x+rnd(-220,220),y:this.zone.y+rnd(-220,220),r:Math.max(100,this.zone.r-180)};
      }
    }
    const inZone=dst(p,this.zone)<this.zone.r;
    document.getElementById('zone-warn').style.display=inZone?'none':'block';
    if(!inZone&&p.invincible<=0&&Math.random()<0.07){p.hp-=1;p.invincible=6;}

    // ---- PICKUPS ----
    this.pickups.forEach(pk=>{
      if(pk.taken||dst(p,pk)>=20) return;
      pk.taken=true;
      if(pk.type==='hp'){p.hp=Math.min(p.maxHp,p.hp+30);this.spawnP(pk.x,pk.y,'#44ff88',12);}
      else{p.reserve=Math.min(90,p.reserve+30);this.spawnP(pk.x,pk.y,'#ffcc00',12);}
    });

    // ---- BULLETS ----
    this.bullets.forEach(b=>{
      if(b.dead) return;
      b.trail.push({x:b.x,y:b.y});
      if(b.trail.length>5) b.trail.shift();
      b.x+=Math.cos(b.angle)*b.speed; b.y+=Math.sin(b.angle)*b.speed;
      if(b.x<0||b.x>WORLD||b.y<0||b.y>WORLD){b.dead=true;return;}
      this.enemies.forEach(e=>{
        if(b.dead||e.dead) return;
        if(dst(b,e)<e.size){
          b.dead=true; e.hp-=20; e.flash=8;
          this.spawnP(e.x,e.y,'#ff8800',6);
          if(e.hp<=0){
            e.dead=true; p.kills++; p.score+=e.type==='tank'?300:e.type==='fast'?150:100;
            this.spawnP(e.x,e.y,'#ff4400',16);
            addKill(`💀 ${['عدو','مقاتل','محارب'][Math.floor(Math.random()*3)]} انهال!`);
          }
        }
      });
    });
    this.bullets=this.bullets.filter(b=>!b.dead);

    // ---- ENEMY BULLETS ----
    this.eBullets.forEach(b=>{
      if(b.dead) return;
      b.x+=Math.cos(b.angle)*b.speed; b.y+=Math.sin(b.angle)*b.speed; b.life--;
      if(b.life<=0||b.x<0||b.x>WORLD||b.y<0||b.y>WORLD){b.dead=true;return;}
      if(dst(b,p)<p.size&&p.invincible<=0){
        b.dead=true; p.hp-=b.dmg; p.invincible=20;
        this.spawnP(p.x,p.y,'#ff2244',6);
      }
    });
    this.eBullets=this.eBullets.filter(b=>!b.dead);

    // ---- ENEMIES ----
    this.enemies.forEach(e=>{
      if(e.dead) return;
      if(e.flash>0) e.flash--;
      const ddx=p.x-e.x,ddy=p.y-e.y,d=Math.hypot(ddx,ddy);
      e.angle=Math.atan2(ddy,ddx);
      if(d>80){e.x+=Math.cos(e.angle)*e.speed;e.y+=Math.sin(e.angle)*e.speed;}
      e.x=clamp(e.x,20,WORLD-20); e.y=clamp(e.y,20,WORLD-20);
      e.shootCD--;
      if(e.shootCD<=0&&d<500){
        const rate=e.type==='tank'?110:e.type==='fast'?35:65;
        e.shootCD=rate+rnd(0,25);
        this.eBullets.push({x:e.x,y:e.y,angle:e.angle+rnd(-0.22,0.22),speed:6,life:160,dmg:e.type==='tank'?20:e.type==='fast'?8:13,dead:false});
      }
    });
    this.enemies=this.enemies.filter(e=>!e.dead);

    // ---- PARTICLES ----
    this.particles.forEach(pt=>{pt.x+=pt.vx;pt.y+=pt.vy;pt.vx*=0.91;pt.vy*=0.91;pt.life-=pt.decay;});
    this.particles=this.particles.filter(pt=>pt.life>0);

    // ---- WAVE ----
    if(this.enemies.length===0){this.waveCD--;if(this.waveCD<=0){this.waveCD=90;this.nextWave();}}

    // ---- DEATH ----
    if(p.hp<=0){
      p.hp=0; this.alive=false;
      if(p.score>bestScore)bestScore=p.score;
      if(p.kills>bestKills)bestKills=p.kills;
      document.getElementById('best').textContent=bestScore;
      document.getElementById('bestkills').textContent=bestKills;
      document.getElementById('go-score').textContent=p.score;
      document.getElementById('go-kills').textContent=p.kills;
      document.getElementById('go-wave').textContent=this.wave;
      setTimeout(()=>document.getElementById('gameover').style.display='flex',600);
      return;
    }

    // ---- HUD ----
    document.getElementById('hpbar').style.width=(Math.max(0,p.hp/p.maxHp)*100)+'%';
    document.getElementById('hpnum').textContent=`${Math.ceil(Math.max(0,p.hp))}/100`;
    document.getElementById('score').textContent=p.score;
    document.getElementById('kills').textContent=p.kills;
    document.getElementById('ammo').textContent=p.reloading?'تحميل...':`${p.ammo}/${p.reserve}`;
    document.getElementById('wavenum').textContent=this.wave;
    document.getElementById('rl-msg').style.display=p.reloading?'block':'none';
  }

  draw() {
    const p=this.p;
    const W=canvas.width, H=canvas.height;
    const camX=p.x-W/2, camY=p.y-H/2;

    // BG
    ctx.fillStyle='#1c1608'; ctx.fillRect(0,0,W,H);

    // Grid
    ctx.strokeStyle='rgba(255,200,80,0.04)'; ctx.lineWidth=1;
    for(let x=(60-camX%60)%60;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=(60-camY%60)%60;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

    // Zone
    const zx=this.zone.x-camX,zy=this.zone.y-camY;
    ctx.save();
    ctx.beginPath();ctx.rect(0,0,W,H);ctx.arc(zx,zy,this.zone.r,0,Math.PI*2,true);
    ctx.fillStyle='rgba(180,0,0,0.1)';ctx.fill();
    ctx.beginPath();ctx.arc(zx,zy,this.zone.r,0,Math.PI*2);
    ctx.strokeStyle='rgba(0,200,255,0.55)';ctx.lineWidth=3;ctx.setLineDash([18,10]);ctx.stroke();ctx.setLineDash([]);
    ctx.restore();

    // Trees
    this.trees.forEach(t=>{
      const tx=t.x-camX,ty=t.y-camY;
      if(tx<-30||tx>W+30||ty<-30||ty>H+30) return;
      ctx.beginPath();ctx.arc(tx,ty,t.r,0,Math.PI*2);ctx.fillStyle=t.c;ctx.fill();
      ctx.fillStyle='#3a2010';ctx.fillRect(tx-3,ty,6,12);
    });

    // Rocks
    this.rocks.forEach(r=>{
      const rx=r.x-camX,ry=r.y-camY;
      if(rx<-60||rx>W+60||ry<-60||ry>H+60) return;
      ctx.beginPath();ctx.ellipse(rx,ry,r.w/2,r.h/2,0,0,Math.PI*2);ctx.fillStyle='#4a4030';ctx.fill();
    });

    // Pickups
    const t=Date.now();
    this.pickups.forEach(pk=>{
      if(pk.taken) return;
      const px=pk.x-camX,py=pk.y-camY;
      if(px<-30||px>W+30||py<-30||py>H+30) return;
      const bob=Math.sin(t*0.005)*3;
      ctx.save();ctx.translate(px,py+bob);
      ctx.beginPath();ctx.arc(0,0,14,0,Math.PI*2);
      ctx.fillStyle=pk.type==='hp'?'rgba(0,255,100,0.22)':'rgba(255,220,0,0.22)';ctx.fill();
      ctx.strokeStyle=pk.type==='hp'?'#44ff88':'#ffcc00';ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle=pk.type==='hp'?'#44ff88':'#ffcc00';
      ctx.font='14px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(pk.type==='hp'?'♥':'⬡',0,0);
      ctx.restore();
    });

    // Particles
    this.particles.forEach(pt=>{
      ctx.globalAlpha=pt.life;
      ctx.beginPath();ctx.arc(pt.x-camX,pt.y-camY,pt.size*pt.life,0,Math.PI*2);
      ctx.fillStyle=pt.color;ctx.fill();
    });
    ctx.globalAlpha=1;

    // Enemy bullets
    this.eBullets.forEach(b=>{
      ctx.beginPath();ctx.arc(b.x-camX,b.y-camY,4,0,Math.PI*2);
      ctx.fillStyle='#ff4400';ctx.shadowBlur=8;ctx.shadowColor='#ff2200';ctx.fill();ctx.shadowBlur=0;
    });

    // Player bullets
    this.bullets.forEach(b=>{
      for(let i=0;i<b.trail.length;i++){
        const tr=b.trail[i];
        ctx.globalAlpha=i/b.trail.length*0.4;
        ctx.beginPath();ctx.arc(tr.x-camX,tr.y-camY,2,0,Math.PI*2);ctx.fillStyle='#ffdd44';ctx.fill();
      }
      ctx.globalAlpha=1;
      ctx.beginPath();ctx.arc(b.x-camX,b.y-camY,3,0,Math.PI*2);
      ctx.fillStyle='#ffee55';ctx.shadowBlur=8;ctx.shadowColor='#ffaa00';ctx.fill();ctx.shadowBlur=0;
    });

    // Enemies
    this.enemies.forEach(e=>{
      const ex=e.x-camX,ey=e.y-camY;
      if(ex<-40||ex>W+40||ey<-40||ey>H+40) return;
      ctx.save();ctx.translate(ex,ey);ctx.rotate(e.angle);
      ctx.beginPath();ctx.arc(0,0,e.size,0,Math.PI*2);
      ctx.fillStyle=e.flash>0?'#fff':e.type==='tank'?'#aa2200':e.type==='fast'?'#aa00cc':'#cc3300';
      ctx.shadowBlur=12;ctx.shadowColor=ctx.fillStyle;ctx.fill();ctx.shadowBlur=0;
      ctx.fillStyle='#444';ctx.fillRect(0,-3,e.size+10,6);
      ctx.rotate(-e.angle);
      ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(-e.size,-e.size-10,e.size*2,5);
      const hpr=e.hp/e.maxHp;
      ctx.fillStyle=hpr>0.5?'#44ff44':hpr>0.25?'#ffaa00':'#ff2200';
      ctx.fillRect(-e.size,-e.size-10,e.size*2*hpr,5);
      ctx.restore();
    });

    // Player
    const flash=p.invincible>0&&Math.floor(p.invincible/5)%2===0;
    if(!flash){
      ctx.save();ctx.translate(p.x-camX,p.y-camY);ctx.rotate(p.angle);
      ctx.beginPath();ctx.arc(0,0,p.size,0,Math.PI*2);
      ctx.fillStyle='#2255ff';ctx.shadowBlur=18;ctx.shadowColor='#4488ff';ctx.fill();ctx.shadowBlur=0;
      ctx.fillStyle='#3366dd';ctx.beginPath();ctx.arc(0,-2,p.size*0.55,Math.PI,0);ctx.fill();
      ctx.fillStyle='#aaa';ctx.fillRect(4,-3,p.size+12,6);
      if(p.muzzle>0){
        ctx.beginPath();ctx.arc(p.size+16,0,7*(p.muzzle/6),0,Math.PI*2);
        ctx.fillStyle=`rgba(255,220,50,${p.muzzle/6})`;ctx.shadowBlur=15;ctx.shadowColor='#ffaa00';ctx.fill();ctx.shadowBlur=0;
      }
      ctx.restore();
    }

    // Desktop crosshair
    if(!isMobile){
      ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(mx-12,my);ctx.lineTo(mx+12,my);ctx.stroke();
      ctx.beginPath();ctx.moveTo(mx,my-12);ctx.lineTo(mx,my+12);ctx.stroke();
      ctx.beginPath();ctx.arc(mx,my,3,0,Math.PI*2);ctx.fillStyle='#ff4444';ctx.fill();
    }

    // Mini map
    const ms=100, mpad=15;
    const mx2=W-ms-mpad, my2=H-ms-mpad;
    ctx.fillStyle='rgba(0,0,0,0.75)';ctx.strokeStyle='rgba(255,100,0,0.4)';ctx.lineWidth=1;
    ctx.beginPath();ctx.rect(mx2,my2,ms,ms);ctx.fill();ctx.stroke();
    const sc=ms/WORLD;
    // zone on mini
    ctx.beginPath();ctx.arc(mx2+this.zone.x*sc,my2+this.zone.y*sc,this.zone.r*sc,0,Math.PI*2);
    ctx.strokeStyle='rgba(0,200,255,0.45)';ctx.lineWidth=1;ctx.stroke();
    // enemies
    this.enemies.forEach(e=>{
      ctx.beginPath();ctx.arc(mx2+e.x*sc,my2+e.y*sc,3,0,Math.PI*2);ctx.fillStyle='#ff4444';ctx.fill();
    });
    // pickups
    this.pickups.forEach(pk=>{
      if(pk.taken) return;
      ctx.beginPath();ctx.arc(mx2+pk.x*sc,my2+pk.y*sc,2,0,Math.PI*2);
      ctx.fillStyle=pk.type==='hp'?'#44ff88':'#ffcc00';ctx.fill();
    });
    // player
    ctx.beginPath();ctx.arc(mx2+p.x*sc,my2+p.y*sc,4,0,Math.PI*2);ctx.fillStyle='#4488ff';ctx.fill();
  }
}

function loop(){
  if(G){G.update();G.draw();}
  else{ctx.fillStyle='#111';ctx.fillRect(0,0,canvas.width,canvas.height);}
  requestAnimationFrame(loop);
}

function startGame(){
  document.getElementById('menu').style.display='none';
  document.getElementById('gameover').style.display='none';
  document.getElementById('hud').style.display='flex';
  document.getElementById('kfeed').innerHTML='';
  document.getElementById('zone-warn').style.display='none';
  document.getElementById('rl-msg').style.display='none';

  if(isMobile){
    document.getElementById('joy-wrap').style.display='block';
    document.getElementById('fire-btn').style.display='flex';
    document.getElementById('reload-btn').style.display='flex';
  }

  G=new Game();
  canvas.style.cursor=isMobile?'default':'none';
}

function showMenu(){
  G=null;
  document.getElementById('menu').style.display='flex';
  document.getElementById('gameover').style.display='none';
  document.getElementById('hud').style.display='none';
  document.getElementById('joy-wrap').style.display='none';
  document.getElementById('fire-btn').style.display='none';
  document.getElementById('reload-btn').style.display='none';
  document.getElementById('zone-warn').style.display='none';
  document.getElementById('rl-msg').style.display='none';
  canvas.style.cursor='default';
  mobileFiring=false;
}

loop();
</script>
</div><!-- end game-root -->
